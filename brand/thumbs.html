<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>body{margin:0;background:#111}</style></head>
<body><canvas id="nobody" width="1080" height="1920"></canvas><canvas id="discipline" width="1080" height="1920"></canvas><canvas id="twenties" width="1080" height="1920"></canvas>
<script type="module">
import { drawNeon as ayaz, POSE, mixPose, emberGround, sparks } from './ayaz.js';
const RED = '#ff2a3c', GOLD = '#ffb81f', WHITE = '#f6f7fb';
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const CROWD = { rim: '#3a3a44', hot: '#4a4a55', glow: 'rgba(80,80,100,' };
function text(g, t, x, y, size, col, glow = 0, rot = 0, font = 'Anton', ls = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.font = `${size}px ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle'; if (ls) g.letterSpacing = ls + 'px'; if (col !== '#0a0000') { g.lineJoin = 'round'; g.lineWidth = size * .12; g.strokeStyle = '#000'; g.strokeText(t, 0, 0); } if (glow) { g.shadowColor = col; g.shadowBlur = glow; } g.fillStyle = col; g.fillText(t, 0, 0); g.restore(); }
function embers(g, n, seed, y0 = 0, y1 = 1920) { for (let i = 0; i < n; i++) { const x = hash(i + seed) * 1080, y = y0 + hash(i + seed + 50) * (y1 - y0), s = 3 + 6 * hash(i + seed + 9); g.fillStyle = hash(i + seed + 3) > .7 ? `rgba(255,184,31,${.4 + .5 * hash(i + 7)})` : `rgba(255,70,90,${.3 + .5 * hash(i + 7)})`; g.save(); g.translate(x, y); g.rotate(.8); g.fillRect(-s / 2, -s / 2, s, s); g.restore(); } }
function vignette(g) { const v = g.createRadialGradient(540, 960, 500, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.8)'); g.fillStyle = v; g.fillRect(0, 0, 1080, 1920); }
await Promise.all(['150px Anton', '700 60px Montserrat'].map(f => document.fonts.load(f)));
{ const g = document.getElementById('nobody').getContext('2d');
  g.fillStyle = '#040406'; g.fillRect(0, 0, 1080, 1920);
  g.save(); g.globalCompositeOperation = 'lighter'; const sp = g.createLinearGradient(0, 600, 0, 1500); sp.addColorStop(0, 'rgba(255,40,60,.05)'); sp.addColorStop(1, 'rgba(255,40,60,.35)'); g.fillStyle = sp; g.beginPath(); g.moveTo(480, 560); g.lineTo(600, 560); g.lineTo(860, 1480); g.lineTo(220, 1480); g.fill(); g.restore();
  for (let i = 0; i < 160; i++) { const x = hash(i) * 1200 - 60, y = hash(i + 9) * 1920; g.strokeStyle = `rgba(200,205,225,${.12 + .2 * hash(i + 3)})`; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 14, y + 60); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 1480); g.lineTo(1080, 1480); g.stroke();
  [[110, .55, true], [250, .48, true], [860, .55, false], [990, .47, false], [40, .4, true], [1060, .4, false]].forEach(([x, s, fl], i) => { g.save(); g.globalAlpha = .55 - i * .05; ayaz(g, x, 1480, s, mixPose(POSE.walkA, POSE.walkB, hash(i)), { col: CROWD, glow: .4, flip: fl }); g.restore(); });
  emberGround(g, 540, 1480, 1.05, 1, { mode: 'kor' });
  ayaz(g, 540, 1480, 1.05, { ...POSE.stand, head: .45, lean: .08, a1: .15, a2: -.15, f1: -.05, f2: -.2 }, { t: 1, mode: 'kor', glow: 1.6, wind: .5 });
  g.save(); g.globalAlpha = .18; g.translate(0, 2960); g.scale(1, -1); ayaz(g, 540, 1480, 1.05, { ...POSE.stand, head: .45, lean: .08 }, { t: 1, mode: 'kor', glow: 1 }); g.restore();
  embers(g, 40, 5, 500, 1500); vignette(g);
  text(g, 'NOBODY', 540, 250, 250, WHITE, 20, -.03); text(g, 'IS COMING', 540, 445, 170, WHITE, 16, -.03);
  g.save(); g.translate(540, 600); g.rotate(-.03); g.fillStyle = RED; g.shadowColor = RED; g.shadowBlur = 40; g.fillRect(-430, -70, 860, 140); g.restore();
  text(g, 'TO SAVE YOU', 540, 600, 138, '#0a0000', 0, -.03);
}
{ const g = document.getElementById('discipline').getContext('2d');
  g.fillStyle = '#050508'; g.fillRect(0, 0, 1080, 1920);
  g.save(); g.beginPath(); g.moveTo(0, 0); g.lineTo(470, 0); g.lineTo(610, 1920); g.lineTo(0, 1920); g.closePath(); g.clip(); g.fillStyle = '#0d0d11'; g.fillRect(0, 0, 1080, 1920);
  for (let i = 0; i < 120; i++) { const x = hash(i) * 600, y = hash(i + 9) * 1920; g.strokeStyle = 'rgba(160,165,185,.15)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 10, y + 50); g.stroke(); }
  g.restore();
  g.save(); g.beginPath(); g.moveTo(470, 0); g.lineTo(1080, 0); g.lineTo(1080, 1920); g.lineTo(610, 1920); g.closePath(); g.clip();
  const r = g.createRadialGradient(820, 1150, 0, 820, 1150, 900); r.addColorStop(0, 'rgba(255,30,52,.6)'); r.addColorStop(1, 'rgba(255,30,52,0)'); g.fillStyle = r; g.fillRect(0, 0, 1080, 1920);
  g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 18; i++) { const an = -Math.PI + i / 18 * Math.PI; g.fillStyle = 'rgba(255,42,60,.06)'; g.beginPath(); g.moveTo(820, 1500); g.lineTo(820 + Math.cos(an - .04) * 1400, 1500 + Math.sin(an - .04) * 1400); g.lineTo(820 + Math.cos(an + .04) * 1400, 1500 + Math.sin(an + .04) * 1400); g.fill(); } g.restore();
  embers(g, 70, 21, 500, 1600); g.restore();
  g.strokeStyle = RED; g.shadowColor = RED; g.shadowBlur = 30; g.lineWidth = 8; g.beginPath(); g.moveTo(470, 0); g.lineTo(610, 1920); g.stroke(); g.shadowBlur = 0;
  g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 1500); g.lineTo(1080, 1500); g.stroke();
  g.strokeStyle = '#5a5a66'; g.lineWidth = 5; g.fillStyle = '#16161c'; g.fillRect(150, 1385, 170, 115); g.strokeRect(150, 1385, 170, 115); ayaz(g, 250, 1500, .8, { ...POSE.sitTall, lean: .75, head: 1.0, a1: .35, a2: .25, f1: .2, f2: .15 }, { col: { rim: '#6a6a76', hot: '#8a8a96', glow: 'rgba(120,120,140,' }, glow: .5 });
  g.strokeStyle = '#6a6a76'; g.lineWidth = 6; g.strokeRect(190, 900, 110, 200); g.fillStyle = '#6a6a76'; g.fillRect(222, 880, 46, 20); g.fillStyle = RED; g.fillRect(202, 1068, 86, 20);
  emberGround(g, 800, 1500, 1.0, 1, { mode: 'kor' }); ayaz(g, 800, 1500, 1.0, mixPose(POSE.walkA, POSE.hero, .25), { t: 1, mode: 'kor', glow: 1.7, wind: .8 });
  vignette(g);
  text(g, 'DISCIPLINE', 540, 270, 215, RED, 46, -.03);
  text(g, 'OVER', 540, 450, 110, WHITE, 14, -.03);
  g.save(); g.translate(540, 590); g.rotate(-.03); text(g, 'MOTIVATION', 0, 0, 150, '#7a7a86', 0); g.strokeStyle = RED; g.lineWidth = 16; g.shadowColor = RED; g.shadowBlur = 20; g.beginPath(); g.moveTo(-400, 10); g.lineTo(400, -10); g.stroke(); g.restore();
  text(g, 'MOTIVATION', 250, 800, 46, '#8a8a96', 0, 0); text(g, 'DISCIPLINE', 820, 800, 46, GOLD, 16, 0);
}
{ const g = document.getElementById('twenties').getContext('2d');
  g.fillStyle = '#050508'; g.fillRect(0, 0, 1080, 1920);
  const r = g.createRadialGradient(540, 1250, 0, 540, 1250, 1000); r.addColorStop(0, 'rgba(255,30,52,.5)'); r.addColorStop(1, 'rgba(255,30,52,0)'); g.fillStyle = r; g.fillRect(0, 0, 1080, 1920);
  // the future, still a blueprint: a dashed grey skyline rising from the foundation
  g.save(); g.setLineDash([18, 14]); g.strokeStyle = 'rgba(180,185,205,.35)'; g.lineWidth = 4;
  [[140, 760, 180], [330, 640, 150], [490, 560, 130], [630, 680, 170], [810, 800, 150]].forEach(([x, top, w]) => { g.strokeRect(x, top, w, 1250 - top); for (let y = top + 50; y < 1200; y += 90) { g.strokeRect(x + 30, y, 40, 45); g.strokeRect(x + w - 70, y, 40, 45); } }); g.restore();
  // foundation: three courses of red glowing blocks, the middle block engraved 20s
  for (let row = 0; row < 3; row++) for (let i = 0; i < 6; i++) { const w = 190, x = 15 + i * 180 - (row % 2) * 90, y = 1250 + row * 115; g.save(); g.shadowColor = '#ff2a3c'; g.shadowBlur = 24; g.strokeStyle = '#ff2a3c'; g.lineWidth = 6; g.fillStyle = 'rgba(40,6,12,.95)'; g.fillRect(x + 6, y + 6, w - 12, 103); g.strokeRect(x + 6, y + 6, w - 12, 103); g.restore(); }
  text(g, '20s', 540, 1430, 120, GOLD, 30);
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 1250); g.lineTo(1080, 1250); g.stroke();
  emberGround(g, 540, 1250, 1.0, 1, { mode: 'kor' }); ayaz(g, 540, 1250, 1.0, POSE.hero, { t: 1, mode: 'kor', glow: 1.7, wind: .7 });
  embers(g, 60, 33, 500, 1700); vignette(g);
  text(g, 'YOUR', 300, 260, 150, WHITE, 16, -.03); text(g, '20s', 690, 250, 300, RED, 50, -.03);
  g.save(); g.translate(540, 480); g.rotate(-.03); g.fillStyle = RED; g.shadowColor = RED; g.shadowBlur = 40; g.fillRect(-470, -72, 940, 144); g.restore();
  text(g, 'ARE YOUR FOUNDATION', 540, 480, 112, '#0a0000', 0, -.03);
}
window.READY = true;
</script></body></html>
